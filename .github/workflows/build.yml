name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AWS Login Hub ${{ github.ref_name }}"
          releaseBody: |
            ## AWS Login Hub ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | **Windows** | `.msi` installer (below) |
            | **macOS (Apple Silicon)** | `.dmg` installer (below) |
            | **macOS (Intel)** | `.dmg` installer (below) |
            | **Linux (Ubuntu/Debian)** | `.deb` installer (below) |
            | **Linux (Fedora/RHEL)** | `.rpm` installer (below) |
            | **Linux (Portable)** | `.AppImage` (below) |

            ### Install

            **Windows:** Download the `.msi` file, double-click to install.

            **macOS:** Download the `.dmg` file, open it, drag to Applications.

            **Ubuntu/Debian:**
            ```bash
            sudo dpkg -i aws-login-hub_*_amd64.deb
            ```

            **Fedora/RHEL:**
            ```bash
            sudo rpm -i aws-login-hub-*.x86_64.rpm
            ```

            **Any Linux:**
            ```bash
            chmod +x aws-login-hub_*.AppImage
            ./aws-login-hub_*.AppImage
            ```

            After install, set up Playwright for login automation:
            ```bash
            npm install -g playwright
            npx playwright install chromium
            ```
          releaseDraft: false
          prerelease: false
