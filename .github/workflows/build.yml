name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential

      - name: Install npm dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy (lint)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AWS Login Hub ${{ github.ref_name }}"
          releaseBody: |
            ## AWS Login Hub ${{ github.ref_name }}

            ### What's New
            - **Hybrid SSO OIDC Login** — Uses AWS OIDC API + Playwright auto-fill
            - **Browser auto-closes** after MFA completion
            - **SSO Access Portal** opens automatically after login
            - **Token cached** at `~/.aws/sso/cache/` for AWS CLI use
            - **Configurable vault timeout** (1, 2, 8, or 10 hours)
            - **Improved UI** — always-visible login button, progress indicator, skeleton loading

            ### Downloads
            | Platform | File |
            |----------|------|
            | **Windows (x64)** | `.msi` or `.exe` installer |
            | **macOS (Apple Silicon)** | `.dmg` (M1/M2/M3/M4) |
            | **macOS (Intel)** | `.dmg` (x86_64) |
            | **Linux (Ubuntu/Debian)** | `.deb` |
            | **Linux (Fedora/RHEL)** | `.rpm` |
            | **Linux (Portable)** | `.AppImage` |

            ### Install

            **Windows:** Download `.msi`, double-click to install.

            **macOS:** Download `.dmg`, drag to Applications. First launch: System Settings → Privacy & Security → "Open Anyway".

            **Linux:**
            ```bash
            # Ubuntu/Debian
            sudo dpkg -i aws-login-hub_*_amd64.deb

            # Fedora/RHEL
            sudo rpm -i aws-login-hub-*.x86_64.rpm

            # Any distro (AppImage)
            chmod +x aws-login-hub_*.AppImage && ./aws-login-hub_*.AppImage
            ```

            ### Post-Install Setup
            ```bash
            npm install -g playwright
            npx playwright install chromium
            ```

            ### Security
            - AES-256-GCM encryption with Argon2id key derivation
            - Credentials passed via env vars, never written to disk
            - Token cache files have `0600` permissions (owner-only)
            - Network calls only to `oidc.{region}.amazonaws.com`
            - MFA is never automated — user enters manually
          releaseDraft: false
          prerelease: false
